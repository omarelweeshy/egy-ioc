[project]
name = "egy-ioc"
version = "0.1.0"
description = "Extract scam indicators (Egyptian phone numbers, mobile wallets, InstaPay handles, lookalike domains, links, amounts) from Egyptian Arabic, Franco-Arab and English messages, with exact offsets."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Omar Ashraf", email = "omarelweshyy@gmail.com" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["threat-intelligence", "ioc", "arabic", "egypt", "phishing", "scam", "smishing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Natural Language :: Arabic",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]

[project.scripts]
egy-ioc = "egy_ioc.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
# Arabic letters in strings and comments are intentional, not lookalike-character mistakes.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
